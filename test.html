<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>3D spausdinimo kainos skaičiuoklė</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
    label { display: block; margin-top: 10px; }
    input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 15px; padding: 8px 12px; }
    .result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
    .result p { margin: 4px 0; }
  </style>
</head>
<body>
  <h1>3D spausdinimo kainos skaičiuoklė</h1>

  <!-- ĮVESTYS -->
  <label>
    Filamento kaina už 1 kg (€):
    <input type="number" id="filamentPricePerKg" value="20" step="0.01">
  </label>

  <label>
    Modelio svoris (g):
    <input type="number" id="modelWeightGrams" value="50" step="0.01">
  </label>

  <label>
    Spausdinimo laikas (valandomis):
    <input type="number" id="printTimeHours" value="3" step="0.1">
  </label>

  <label>
    Spausdintuvo galia (W):
    <input type="number" id="printerPowerW" value="150" step="1">
  </label>

  <label>
    Elektros kaina už 1 kWh (€):
    <input type="number" id="electricityPricePerKWh" value="0.25" step="0.01">
  </label>

  <label>
    Darbo valandos kaina (€ / val.):
    <input type="number" id="laborRatePerHour" value="5" step="0.01">
  </label>

  <label>
    Pelno marža (%):
    <input type="number" id="profitMarginPercent" value="30" step="1">
  </label>

  <button onclick="calculateCost()">Skaičiuoti kainą</button>

  <!-- REZULTATAS -->
  <div class="result" id="resultBox" style="display:none;">
    <h2>Rezultatas</h2>
    <p id="filamentCost"></p>
    <p id="electricityCost"></p>
    <p id="laborCost"></p>
    <hr>
    <p id="totalCost"></p>
    <p id="finalPrice"></p>
  </div>

  <script>
    function calculateCost() {
      // Paimam reikšmes
      const filamentPricePerKg = parseFloat(document.getElementById('filamentPricePerKg').value) || 0;
      const modelWeightGrams = parseFloat(document.getElementById('modelWeightGrams').value) || 0;
      const printTimeHours = parseFloat(document.getElementById('printTimeHours').value) || 0;
      const printerPowerW = parseFloat(document.getElementById('printerPowerW').value) || 0;
      const electricityPricePerKWh = parseFloat(document.getElementById('electricityPricePerKWh').value) || 0;
      const laborRatePerHour = parseFloat(document.getElementById('laborRatePerHour').value) || 0;
      const profitMarginPercent = parseFloat(document.getElementById('profitMarginPercent').value) || 0;

      // Filamento kaina
      const filamentCost = (modelWeightGrams / 1000) * filamentPricePerKg;

      // Elektros kaina
      const kWhUsed = (printerPowerW * printTimeHours) / 1000;
      const electricityCost = kWhUsed * electricityPricePerKWh;

      // Darbo kaina (jei nori skaičiuoti savo laiką)
      const laborCost = printTimeHours * laborRatePerHour;

      // Savikaina
      const totalCost = filamentCost + electricityCost + laborCost;

      // Galutinė kaina su marža
      const finalPrice = totalCost * (1 + profitMarginPercent / 100);

      // Atvaizdavimas
      document.getElementById('filamentCost').textContent =
        'Filamento kaina: ' + filamentCost.toFixed(2) + ' €';
      document.getElementById('electricityCost').textContent =
        'Elektros kaina: ' + electricityCost.toFixed(2) + ' €';
      document.getElementById('laborCost').textContent =
        'Darbo kaina: ' + laborCost.toFixed(2) + ' €';

      document.getElementById('totalCost').textContent =
        'Bendra savikaina: ' + totalCost.toFixed(2) + ' €';
      document.getElementById('finalPrice').textContent =
        'Siūloma pardavimo kaina (su marža): ' + finalPrice.toFixed(2) + ' €';

      document.getElementById('resultBox').style.display = 'block';
    }
  </script>
</body>
</html>
