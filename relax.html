<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spausdinimo Skaičiuoklė + Aurora</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        
        body {
            position: relative;
            font-family: Arial, sans-serif;
        }
        
        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -10;
        }

        /* EPIC 3D spausdinimo skaičiuoklė */
        #calc {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.65);
            padding: 20px;
            border-radius: 12px;
            color: #fff;
            width: 300px;
            font-family: Arial, sans-serif;
            z-index: 999;
            backdrop-filter: blur(6px);
        }

        #calc h2 {
            margin-bottom: 15px;
            font-size: 22px;
            text-align: center;
        }

        #calc label {
            margin-top: 10px;
            display: block;
            font-size: 14px;
        }

        #calc input {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
        }

        #calc h3 {
            margin-top: 15px;
            text-align: center;
            font-size: 18px;
        }

        #finalPrice {
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <canvas id="aurora-canvas"></canvas>

    <!-- EPIC 3D spausdinimo skaičiuoklė -->
    <div id="calc">
        <h2>3D Spausdinimo Skaičiuoklė</h2>

        <label>Filamento kaina (€/kg):</label>
        <input type="number" id="filamentPrice" value="20" step="0.01">

        <label>Sunaudota medžiaga (g):</label>
        <input type="number" id="grams" value="50" step="0.1">

        <label>Spausdinimo laikas (val.):</label>
        <input type="number" id="hours" value="3" step="0.1">

        <label>Spausdintuvo galia (W):</label>
        <input type="number" id="watts" value="250" step="1">

        <label>Elektros kaina (€/kWh):</label>
        <input type="number" id="kwhPrice" value="0.30" step="0.01">

        <label>Valandinis įkainis (€):</label>
        <input type="number" id="hourRate" value="1.50" step="0.01">

        <label>Pelno procentas (%):</label>
        <input type="number" id="profit" value="30" step="1">

        <h3>Galutinė kaina: <span id="finalPrice">0€</span></h3>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // WebGL Aurora Background
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        const canvas = document.getElementById('aurora-canvas');
        canvas.parentNode.replaceChild(renderer.domElement, canvas);

        const material = new THREE.ShaderMaterial({
            uniforms: {
                iTime: { value: 0 },
                iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader: `
                void main() {
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float iTime;
                uniform vec2 iResolution;

                #define NUM_OCTAVES 3

                float rand(vec2 n) { 
                    return fract(sin(dot(n, vec2(12.9898, 4.1414))) * 43758.5453);
                }

                float noise(vec2 p){
                    vec2 ip = floor(p);
                    vec2 u = fract(p);
                    u = u*u*(3.0-2.0*u);
                    
                    float res = mix(
                        mix(rand(ip),rand(ip+vec2(1.0,0.0)),u.x),
                        mix(rand(ip+vec2(0.0,1.0)),rand(ip+vec2(1.0,1.0)),u.x),u.y);
                    return res*res;
                }

                float fbm(vec2 x) {
                    float v = 0.0;
                    float a = 0.3;
                    vec2 shift = vec2(100);    
                    mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.50));
                    for (int i = 0; i < NUM_OCTAVES; ++i) {
                        v += a * noise(x);
                        x = rot * x * 2.0 + shift;
                        a *= 0.4;
                    }
                    return v;
                }

                void main() {
                    vec2 shake = vec2(sin(iTime * 1.2) * 0.005, cos(iTime * 2.1) * 0.005);
                    
                    vec2 p = ((gl_FragCoord.xy + shake * iResolution.xy) - iResolution.xy * 0.5) / iResolution.y * mat2(6.0, -4.0, 4.0, 6.0);
                    vec2 v;
                    vec4 o = vec4(0.0);
                    
                    float f = 2.0 + fbm(p + vec2(iTime * 5.0, 0.0)) * 0.5; 
                    
                    for(float i = 0.0; i++ < 35.0;)
                    {
                        v = p + cos(i * i + (iTime + p.x * 0.08) * 0.025 + i * vec2(13.0, 11.0)) * 3.5 + vec2(sin(iTime * 3.0 + i) * 0.003, cos(iTime * 3.5 - i) * 0.003);
                        
                        float tailNoise = fbm(v + vec2(iTime * 0.5, i)) * 0.3 * (1.0 - (i / 35.0)); 
                        
                        vec4 auroraColors = vec4(
                            0.1 + 0.3 * sin(i * 0.2 + iTime * 0.4),
                            0.3 + 0.5 * cos(i * 0.3 + iTime * 0.5),
                            0.7 + 0.3 * sin(i * 0.4 + iTime * 0.3),
                            1.0
                        );
                        
                        vec4 currentContribution = auroraColors * exp(sin(i * i + iTime * 0.8)) / length(max(v, vec2(v.x * f * 0.015, v.y * 1.5)));
                        
                        float thinnessFactor = smoothstep(0.0, 1.0, i / 35.0) * 0.6; 
                        o += currentContribution * (1.0 + tailNoise * 0.8) * thinnessFactor;
                    }
                    
                    o = tanh(pow(o / 100.0, vec4(1.6)));
                    gl_FragColor = o * 1.5;
                }
            `
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        function animate() {
            requestAnimationFrame(animate);
            material.uniforms.iTime.value += 0.016;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
        });

        animate();

        // EPIC 3D spausdinimo skaičiuoklės logika
        function updateEpicPrice() {
            const filamentPrice = parseFloat(document.getElementById("filamentPrice").value) || 0;
            const grams = parseFloat(document.getElementById("grams").value) || 0;
            const hours = parseFloat(document.getElementById("hours").value) || 0;
            const watts = parseFloat(document.getElementById("watts").value) || 0;
            const kwhPrice = parseFloat(document.getElementById("kwhPrice").value) || 0;
            const hourRate = parseFloat(document.getElementById("hourRate").value) || 0;
            const profit = parseFloat(document.getElementById("profit").value) || 0;

            // Filamento kaina
            const filamentCost = (filamentPrice / 1000) * grams;

            // Elektros kaina
            const kwhUsed = (watts * hours) / 1000;
            const electricityCost = kwhUsed * kwhPrice;

            // Spausdinimo laiko kaina
            const timeCost = hours * hourRate;

            // Bendra savikaina
            const totalCost = filamentCost + electricityCost + timeCost;

            // Pelno pritaikymas
            const finalPrice = totalCost * (1 + profit / 100);

            document.getElementById("finalPrice").innerText = finalPrice.toFixed(2) + "€";
        }

        document.querySelectorAll("#calc input").forEach(el => {
            el.addEventListener("input", updateEpicPrice);
        });

        updateEpicPrice();
    </script>
</body>
</html>
